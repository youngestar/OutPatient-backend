server:
  port: 8205
spring:
  application:
    name: Outpatient-backend-medical
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  session:
    timeout: 2592000

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 可选配置
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3

  # 数据库相关配置
  datasource:
    url: jdbc:mysql://localhost:3306/hospital_management_system
    username: root
    password: 258013
    hikari:
      max-lifetime: 1800000
      idle-timeout: 600000
      minimum-idle: 5

  mail:
    host: smtp.qq.com
    default-encoding: UTF-8
    username: 1286958193@qq.com
    password: xvdzhnhhwvurhfbf  # 确保这是QQ邮箱的授权码而不是登录密码
    port: 465
    protocol: smtps  # 改为smtps协议
    test-connection: false  # 禁用启动时测试连接
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
      timeout: 5000
      password: 258013

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Sa-Token配置（Gateway专用）
sa-token:
  # taken 名称
  token-name: satoken
  # token 风格
  token-style: uuid
  # token 有效期
  timeout: 2592000
  # token 最低活跃频率
  active-timeout: -1
  # token 持久化
  is-save-session: true
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token
  is-share: true
  # 是否输出 Sa-Token 日志
  is-log: true
  # Jwt 签名密钥
  jwt-secret-key: graduation-gateway-secret-key-2025
  auto-renew: true

  # Redis配置（如果使用Redis存储token）
  token-prefix: "satoken:"
  is-read-body: false
  is-read-header: true
  is-read-cookie: false
  dynamic-active-timeout: true

# Medical模块配置
medical:
  global:
    feedback-valid-days: 15
    diagnosis-retention-years: 30
    max-prescription-items: 10
    max-message-length: 1000
    unread-reminder-interval: 30
    auto-archive-days: 365
    enable-diagnosis-template: true
    template-path: "/data/templates"
    max-attachment-size: 50
    allowed-attachment-types: ["jpg", "jpeg", "png", "pdf", "doc", "docx"]
    patient-data-masking: true
    urgent-message-process-time: 10

# MinIO 配置
minio:
  endpoint: http://localhost:9000  # MinIO 服务器地址
  access-key: minioadmin           # 访问密钥
  secret-key: minioadmin           # 秘密密钥
  bucket-name: user-avatar         # 存储桶名称

ai-service:
  api-url: https://api.deepseek.com
  api-key: sk-11c289f3111c47aaa1a8e7665729934a